<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colaboradores | Club Deportivo Canteras Trail</title>
  <meta name="description" content="Página de colaboradores de Club Deportivo Canteras Trail." />
  <style>
    :root {
      --azul: #38BDF8;
      --azul-oscuro: #0B3B52;
      --amarillo: #FDE047;
      --fondo: #F6FAFE;
      --texto: #0F172A;
      --gris: #64748B;
      --blanco: #FFFFFF;
      --radio: 20px;
      --ancho: 1240px;
      --sombra: 0 10px 30px rgba(2, 6, 23, .12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--fondo); color:var(--texto); line-height:1.5; }
    header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.88); backdrop-filter:blur(10px); border-bottom:1px solid rgba(15,23,42,.08); }
    .topbar { max-width:var(--ancho); margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; min-width:280px; }
    .brand-logo { width:70px; height:70px; border-radius:50%; background:var(--blanco); border:2px solid rgba(0,0,0,.08); overflow:hidden; display:block; flex:0 0 70px; box-shadow:0 6px 16px rgba(2,6,23,.10); }
    .brand-logo img { width:100%; height:100%; object-fit:cover; display:block; }
    .brand .name { display:grid; line-height:1.1; }
    .brand strong { font-size:14px; }
    .brand span { font-size:12px; color:var(--gris); }
    nav ul { list-style:none; padding:0; margin:0; display:flex; gap:10px; flex-wrap:wrap; }
    nav a { text-decoration:none; color:var(--texto); font-weight:900; font-size:13px; padding:8px 10px; border-radius:999px; }
    nav a:hover { background:rgba(56,189,248,.16); color:var(--azul-oscuro); }

    .hero { max-width:var(--ancho); margin:0 auto; padding:26px 18px 16px; }
    .hero-banner { position:relative; overflow:hidden; min-height:290px; border-radius:28px; box-shadow:var(--sombra); background:linear-gradient(180deg, rgba(56,189,248,1) 0%, rgba(182,221,239,1) 100%); border:1px solid rgba(15,23,42,.06); }
    .hero-banner::after { content:""; position:absolute; top:-120px; right:-140px; width:520px; height:520px; background:radial-gradient(circle, rgba(253,224,71,.45), rgba(253,224,71,0) 62%); pointer-events:none; }
    .stars::before { content:""; position:absolute; inset:0; background-image: radial-gradient(circle at 16% 24%, rgba(255,255,255,.35) 0 3px, transparent 4px), radial-gradient(circle at 28% 18%, rgba(255,255,255,.28) 0 3px, transparent 4px), radial-gradient(circle at 53% 20%, rgba(255,255,255,.30) 0 3px, transparent 4px), radial-gradient(circle at 67% 16%, rgba(255,255,255,.25) 0 3px, transparent 4px), radial-gradient(circle at 82% 14%, rgba(255,255,255,.28) 0 3px, transparent 4px), radial-gradient(circle at 92% 22%, rgba(255,255,255,.30) 0 3px, transparent 4px); pointer-events:none; }
    .mountains, .mountains2 { position:absolute; left:0; right:0; bottom:0; height:46%; background:rgba(11,59,82,.30); clip-path: polygon(0 68%, 9% 47%, 22% 64%, 34% 33%, 47% 61%, 58% 27%, 70% 58%, 83% 38%, 100% 61%, 100% 100%, 0 100%); }
    .mountains2 { height:38%; background:rgba(11,59,82,.52); clip-path: polygon(0 86%, 13% 58%, 31% 80%, 51% 35%, 68% 72%, 87% 45%, 100% 66%, 100% 100%, 0 100%); }
    .hero-inner { position:relative; z-index:2; display:flex; gap:26px; align-items:flex-start; padding:34px 34px 28px; }
    .badge-wrap { position:relative; width:136px; flex:0 0 136px; }
    .badge-shadow { position:absolute; left:10px; right:10px; bottom:-14px; height:18px; background:rgba(11,59,82,.18); filter:blur(8px); border-radius:50%; }
    .hero-badge { width:136px; height:136px; border-radius:50%; background:var(--blanco); border:3px solid rgba(11,59,82,.12); box-shadow:0 10px 20px rgba(2,6,23,.14); overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .hero-badge img { width:100%; height:100%; object-fit:cover; display:block; }
    .hero-badge-placeholder, .brand-logo-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:rgba(11,59,82,.26); font-size:32px; font-weight:900; background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,250,254,1)); }
    .hero-copy h1 { margin:18px 0 8px; font-size:clamp(36px,5vw,72px); line-height:1; color:rgba(255,255,255,.92); letter-spacing:-.02em; }
    .hero-copy p { margin:0; color:rgba(255,255,255,.82); font-size:16px; }

    .container { max-width:var(--ancho); margin:0 auto; padding:10px 18px 40px; }
    .section-title { margin:8px 0 14px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .section-title h2 { margin:0; font-size:22px; letter-spacing:-.01em; }
    .section-title p { margin:0; color:var(--gris); font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:18px; }
    .card { background:var(--blanco); border:2px solid #D7E8F4; border-radius:24px; box-shadow:var(--sombra); min-height:232px; padding:14px 14px 18px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; transition:transform .12s ease, box-shadow .2s ease; overflow:hidden; }
    .card:hover { transform:translateY(-2px); box-shadow:0 16px 34px rgba(2,6,23,.14); }
    .card-topbar { width:100%; height:16px; border-radius:999px; background:var(--azul); margin-bottom:18px; }
    .logo-box { width:100%; height:148px; display:flex; align-items:center; justify-content:center; border-radius:16px; background:rgba(246,250,254,.45); }
    .logo-box img { max-width:96%; max-height:96%; object-fit:contain; display:block; }
    .logo-placeholder { width:90px; height:90px; border-radius:50%; border:2px solid rgba(56,189,248,.55); display:flex; align-items:center; justify-content:center; color:var(--azul); font-size:48px; line-height:1; background:rgba(56,189,248,.08); }
    .card .actions { margin-top:auto; padding-top:14px; width:100%; display:flex; justify-content:center; }
    .btn-collab { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; border:0; cursor:pointer; white-space:normal; padding:10px 14px; border-radius:12px; font-weight:900; font-size:14px; background:rgba(56,189,248,.14); color:var(--azul-oscuro); max-width:100%; text-align:center; line-height:1.25; }
    .btn-collab:hover { background:rgba(56,189,248,.22); }
    footer { margin-top:12px; background:#071B26; color:rgba(255,255,255,.88); padding:24px 18px; }
    .footer-inner { max-width:var(--ancho); margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
    footer a { color:var(--amarillo); text-decoration:none; font-weight:950; }
    footer a:hover { text-decoration:underline; }
    @media (max-width:900px) { .hero-inner { flex-direction:column; align-items:flex-start; } .hero-copy h1 { font-size:clamp(34px,9vw,58px); } .hero-banner { min-height:250px; } }
  </style>
</head>

    function renderClubLogo() {
      const slots = [document.getElementById('brandLogoSlot'), document.getElementById('heroLogoSlot')];
      slots.forEach(slot => {
        if (!slot) return;
        if (CLUB_LOGO_BASE64 && CLUB_LOGO_BASE64.trim()) {
          slot.innerHTML = `<img src="${CLUB_LOGO_BASE64}" alt="Logo del club">`;
        } else {
          slot.innerHTML = `<div class="brand-logo-placeholder">CT</div>`;
        }
      });
    }
    function crearTarjeta(colab) {
      const enlace = (colab.enlace && colab.enlace.trim()) ? colab.enlace.trim() : '#';
      const tieneLogo = !!(colab.logo && colab.logo.trim());
      const nombre = (colab.nombre && colab.nombre.trim()) ? colab.nombre.trim() : 'Nuevo colaborador';
      return `
        <article class="card">
          <div class="card-topbar"></div>
          <div class="logo-box">
            ${tieneLogo ? `<img src="${colab.logo}" alt="Logo de ${nombre}">` : `<div class="logo-placeholder">⊕</div>`}
          </div>
          <div class="actions">
            <a class="btn-collab" href="${enlace}" target="_blank" rel="noopener">${nombre}</a>
          </div>
        </article>`;
    }
    renderClubLogo();
    document.getElementById('gridColaboradores').innerHTML = COLABORADORES.map(crearTarjeta).join('');
  </script>
